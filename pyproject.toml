[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "mandible-rvc"
version = "0.1.0"
description = "Headless RVC v2 vocal model trainer and ONNX exporter for Mandible"
readme = "README.md"
authors = [{ name = "Xen10 Industries" }]
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.22.0",
    "scipy>=1.10.0",
    "soundfile>=0.12.0",
    "librosa>=0.10.0",
    "onnx>=1.14.0",
    "onnxruntime>=1.16.0",
    "tqdm>=4.65.0",
]

[project.scripts]
mandible-rvc = "mandible_rvc.__main__:main"
